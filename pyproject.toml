[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepinn-thesis"
version = "1.0.0"
description = "Reproducible SleepINN databank, retrieval, benchmark, and analysis workflows"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["src"]
